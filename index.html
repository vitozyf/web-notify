<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人工智能训练师 - 刷题系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
        }
        .app-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .top-bar {
            background: #fff;
            border-radius: 16px;
            padding: 16px 24px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .top-bar .logo {
            font-size: 20px;
            font-weight: 700;
            color: #1a73e8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .top-bar .logo span {
            background: #1a73e8;
            color: #fff;
            font-size: 14px;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 500;
        }
        .top-nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .top-nav button {
            padding: 8px 20px;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: #f0f2f5;
            color: #555;
        }
        .top-nav button:hover {
            background: #e4e7ec;
        }
        .top-nav button.active {
            background: #1a73e8;
            color: #fff;
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
        }
        .top-nav button .badge {
            background: #ea4335;
            color: #fff;
            border-radius: 50%;
            padding: 0 8px;
            font-size: 12px;
            margin-left: 4px;
        }
        .top-nav button .badge.zero {
            background: #888;
        }
        .stats-bar {
            background: #fff;
            border-radius: 12px;
            padding: 12px 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .stats-bar .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stats-bar .stat-item .num {
            font-weight: 700;
            font-size: 18px;
            color: #1a73e8;
        }
        .stats-bar .stat-item .num.green {
            color: #34a853;
        }
        .stats-bar .stat-item .num.red {
            color: #ea4335;
        }
        .stats-bar .stat-item .num.gray {
            color: #888;
        }
        .main-card {
            background: #fff;
            border-radius: 16px;
            padding: 24px 28px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            min-height: 500px;
        }
        .home-page {
            text-align: center;
            padding: 40px 20px;
        }
        .home-page h1 {
            font-size: 28px;
            margin-bottom: 12px;
            color: #1a73e8;
        }
        .home-page p {
            color: #666;
            font-size: 16px;
            margin-bottom: 32px;
        }
        .home-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 700px;
            margin: 0 auto;
        }
        .home-grid .card {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 28px 16px;
            cursor: pointer;
            transition: all 0.25s;
            border: 2px solid transparent;
        }
        .home-grid .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            border-color: #1a73e8;
        }
        .home-grid .card .icon {
            font-size: 40px;
            margin-bottom: 12px;
        }
        .home-grid .card h3 {
            font-size: 18px;
            margin-bottom: 6px;
        }
        .home-grid .card p {
            font-size: 13px;
            color: #888;
            margin: 0;
        }
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .question-header .q-tag {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            background: #e8f0fe;
            color: #1a73e8;
        }
        .question-header .q-tag.multi {
            background: #fce8e6;
            color: #ea4335;
        }
        .question-header .q-tag.judge {
            background: #e6f4ea;
            color: #34a853;
        }
        .question-header .q-index {
            font-size: 14px;
            color: #888;
        }
        .question-text {
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 24px;
            padding: 16px 20px;
            background: #f8f9fa;
            border-radius: 12px;
            min-height: 60px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }
        .options .opt {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            border: 2px solid #e8eaed;
            cursor: pointer;
            transition: all 0.15s;
            background: #fff;
            font-size: 15px;
            line-height: 1.5;
        }
        .options .opt:hover {
            border-color: #b3b8c0;
            background: #fafafa;
        }
        .options .opt.selected {
            border-color: #1a73e8;
            background: #e8f0fe;
        }
        .options .opt.correct {
            border-color: #34a853;
            background: #e6f4ea;
        }
        .options .opt.wrong {
            border-color: #ea4335;
            background: #fce8e6;
        }
        .options .opt .label {
            font-weight: 600;
            color: #555;
            min-width: 24px;
            flex-shrink: 0;
        }
        .options .opt .text {
            flex: 1;
        }
        .options .opt.disabled {
            cursor: default;
        }
        .options .opt.disabled:hover {
            background: #fff;
            border-color: #e8eaed;
        }
        .options .opt.disabled.selected:hover {
            background: #e8f0fe;
            border-color: #1a73e8;
        }
        .options .opt.disabled.correct:hover {
            background: #e6f4ea;
            border-color: #34a853;
        }
        .options .opt.disabled.wrong:hover {
            background: #fce8e6;
            border-color: #ea4335;
        }
        .explanation {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 16px 20px;
            margin-top: 16px;
            border-left: 4px solid #1a73e8;
            font-size: 14px;
            line-height: 1.6;
            display: none;
        }
        .explanation.show {
            display: block;
        }
        .explanation strong {
            color: #1a73e8;
        }
        .explanation .analysis {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #d0d4d9;
            color: #444;
        }
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #e8eaed;
        }
        .action-bar .left {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .action-bar .right {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: #f0f2f5;
            color: #555;
        }
        .btn:hover {
            background: #e4e7ec;
        }
        .btn-primary {
            background: #1a73e8;
            color: #fff;
        }
        .btn-primary:hover {
            background: #1557b0;
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
        }
        .btn-success {
            background: #34a853;
            color: #fff;
        }
        .btn-success:hover {
            background: #2d9248;
        }
        .btn-danger {
            background: #ea4335;
            color: #fff;
        }
        .btn-danger:hover {
            background: #d33426;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #d0d4d9;
        }
        .btn-outline:hover {
            border-color: #888;
            background: #f5f5f5;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-submit-multi {
            background: #fbbc04;
            color: #333;
        }
        .btn-submit-multi:hover {
            background: #f9ab00;
        }
        .number-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #e8eaed;
        }
        .number-nav .num-item {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid #e8eaed;
            background: #fff;
            transition: all 0.15s;
            color: #555;
        }
        .number-nav .num-item:hover {
            border-color: #1a73e8;
            transform: scale(1.05);
        }
        .number-nav .num-item.active {
            border-color: #1a73e8;
            background: #1a73e8;
            color: #fff;
        }
        .number-nav .num-item.answered {
            border-color: #34a853;
            background: #e6f4ea;
            color: #34a853;
        }
        .number-nav .num-item.answered.active {
            background: #1a73e8;
            color: #fff;
            border-color: #1a73e8;
        }
        .number-nav .num-item.wrong-answer {
            border-color: #ea4335;
            background: #fce8e6;
            color: #ea4335;
        }
        .number-nav .num-item.wrong-answer.active {
            background: #1a73e8;
            color: #fff;
            border-color: #1a73e8;
        }
        .number-nav .num-item.current-wrong {
            border-color: #ea4335;
            background: #ea4335;
            color: #fff;
        }
        .number-nav .num-item.current-wrong.answered {
            background: #ea4335;
            color: #fff;
            border-color: #ea4335;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
        .empty-state .icon {
            font-size: 56px;
            margin-bottom: 16px;
        }
        .empty-state h3 {
            font-size: 20px;
            color: #555;
            margin-bottom: 8px;
        }
        .progress-wrap {
            background: #e8eaed;
            border-radius: 20px;
            height: 6px;
            overflow: hidden;
            margin: 12px 0 8px;
            flex: 1;
            min-width: 80px;
        }
        .progress-wrap .bar {
            height: 100%;
            border-radius: 20px;
            background: linear-gradient(90deg, #1a73e8, #34a853);
            transition: width 0.3s;
            width: 0%;
        }
        .multi-hint {
            font-size: 13px;
            color: #888;
            margin-top: -12px;
            margin-bottom: 12px;
        }
        @media (max-width: 640px) {
            .app-container {
                padding: 10px;
            }
            .main-card {
                padding: 16px;
            }
            .top-bar {
                padding: 12px 16px;
            }
            .top-bar .logo {
                font-size: 17px;
            }
            .top-nav button {
                padding: 6px 14px;
                font-size: 13px;
            }
            .question-text {
                font-size: 15px;
                padding: 12px 16px;
            }
            .options .opt {
                padding: 10px 14px;
                font-size: 14px;
            }
            .number-nav .num-item {
                width: 34px;
                height: 34px;
                font-size: 12px;
            }
            .stats-bar {
                font-size: 12px;
                padding: 10px 14px;
            }
            .stats-bar .stat-item .num {
                font-size: 16px;
            }
            .home-grid {
                grid-template-columns: 1fr 1fr;
            }
            .action-bar .left,
            .action-bar .right {
                width: 100%;
                justify-content: center;
            }
        }
        @media (max-width: 420px) {
            .home-grid {
                grid-template-columns: 1fr;
            }
            .top-nav button {
                font-size: 12px;
                padding: 5px 12px;
            }
        }
        .hidden {
            display: none !important;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .text-muted {
            color: #888;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="app-container" id="app">
        <div class="top-bar">
            <div class="logo">
                📚 刷题系统
                <span>AI训练师</span>
            </div>
            <div class="top-nav">
                <button class="active" data-mode="home">🏠 首页</button>
                <button data-mode="order">📖 顺序练习</button>
                <button data-mode="random">🎲 随机练习</button>
                <button data-mode="wrong">❌ 错题库 <span class="badge zero" id="wrongBadge">0</span></button>
            </div>
        </div>

        <div class="stats-bar" id="statsBar">
            <div class="stat-item">📝 总题 <span class="num" id="totalNum">0</span></div>
            <div class="stat-item">✅ 已答 <span class="num green" id="answeredNum">0</span></div>
            <div class="stat-item">❌ 错误 <span class="num red" id="wrongNum">0</span></div>
            <div class="stat-item" style="flex:1;min-width:60px;">
                <span style="margin-right:6px;">进度</span>
                <div class="progress-wrap"><div class="bar" id="progressBar"></div></div>
                <span id="progressText" style="font-weight:600;font-size:14px;min-width:36px;">0%</span>
            </div>
        </div>

        <div class="main-card" id="mainCard">
            <div id="homePage" class="home-page">
                <h1>🧠 人工智能训练师</h1>
                <p>理论题库 · 共 <strong id="homeTotal">0</strong> 道题</p>
                <div class="home-grid">
                    <div class="card" data-mode="order">
                        <div class="icon">📖</div>
                        <h3>顺序练习</h3>
                        <p>按题库顺序逐题练习</p>
                    </div>
                    <div class="card" data-mode="random">
                        <div class="icon">🎲</div>
                        <h3>随机练习</h3>
                        <p>随机抽题，挑战未知</p>
                    </div>
                    <div class="card" data-mode="wrong">
                        <div class="icon">❌</div>
                        <h3>错题库</h3>
                        <p id="wrongCountDesc">复习做错的题目</p>
                    </div>
                </div>
                <div style="padding: 50px;">
                     <button class="resetbtn" data-mode="order">全部重置</button>
                     <script>
                         document.querySelector('.resetbtn').addEventListener('click', function() {
                            localStorage.clear();
                            location.reload();
                         });
                     </script>
                     <style>
                         .resetbtn {
                            padding: 12px 30px;
                            border: none;
                            border-radius: 24px;
                            font-size: 14px;
                            font-weight: 600;
                            cursor: pointer;
                            transition: all 0.2s;
                            background: #f0f2f5;
                            color: #555;
                        }
                        .resetbtn:hover {
                            background: #e4e7ec;
                        }
                     </style>
                </div>
            </div>

            <div id="practicePage" class="hidden">
                <div class="question-header">
                    <span class="q-tag" id="qTag">单选题</span>
                    <span class="q-index" id="qIndex">1 / 350</span>
                </div>
                <div class="question-text" id="qText">加载中...</div>
                <div class="options" id="optionsContainer"></div>
                <div class="multi-hint" id="multiHint"></div>
                <div class="explanation" id="explanationBox"></div>
                <div class="action-bar">
                    <div class="left">
                        <button class="btn btn-outline" id="prevBtn">◀ 上一题</button>
                        <button class="btn btn-outline" id="nextBtn">下一题 ▶</button>
                    </div>
                    <div class="right">
                        <button class="btn btn-submit-multi" id="submitMultiBtn" style="display:none;">✅ 提交多选</button>
                        <button class="btn btn-danger" id="resetCurrentBtn">🔄 重做此题</button>
                        <button class="btn btn-primary" id="showAnswerBtn">💡 显示答案</button>
                    </div>
                </div>
                <div class="number-nav" id="numberNav"></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 数据（完整题库，含解析）
        // ============================================================
        const RAW_DATA = [
            // 单选题 (type=0) 带解析
            [0, 0, '下列选项中，不是模式所具有的直观特性的是（）。', ['可观察性', '互逆性', '可区分性', '相似性'], 'B', '模式具有可观察性、可区分性、相似性，互逆性不是模式的直观特性。'],
            [1, 0, '智能训练师比赛中需要提交的压缩包后缀是什么（）', ['.py', '.Ui', '.c', '.rar'], 'D', '比赛中通常要求提交压缩包，.rar是常见压缩格式。'],
            [2, 0, '根据数据源的数量以及缺失、不一致或者冗余情况，决定（）和清洗步骤。', ['数据转换', '数据查看', '数据查阅', '数据观察'], 'A', '数据转换是数据预处理的关键步骤，根据数据质量决定转换方式。'],
            [3, 0, '为了解决如何模拟人类的感性思维，例如视觉理解、直觉思维、悟性等，研究者找到一个重要的信息处理的机制是（）。', ['专家系统', '人工神经网络', '模式识别', '智能代理'],
            'B', '人工神经网络模拟人脑神经元结构，适合处理感性思维问题。'],
            [4, 0, '对于神经网络模型，当样本足够多时，少量输入样本中带有较大的误差甚至个别错误对模型的输入-输出映射关系影响很小，这属于（）。',
                ['泛化能力', '容错能力', '搜索能力', '非线性映射能力'], 'B', '容错能力指模型对噪声和异常数据的鲁棒性。'
            ],
            [5, 0, '移动机器人在不平整地面上移动，下列哪种轨迹规划方式可以对地面运动建模（）。', ['图形搜索法', '参数优化法', '反馈控制法', '没有'], 'B', '参数优化法通过优化参数适应地形变化。'],
            [6, 0, '下列软件属于下载工具的是（）。', ['FrontPage', 'FlashGet', 'FoxPro', 'Powerpoint'], 'B', 'FlashGet是经典的下载工具。'],
            [7, 0, '下面哪一项对于开环系统描述是错误的（）。', ['开环系统控制环路相较于闭环系统更简单', '开环系统输入不会根据输出做变化',
                '开环系统需要系统对反馈回来的值进行比较后调整输出', '对于同一套控制系统，开环系统成本较低'
            ], 'C', '开环系统没有反馈，不需要比较输出值，C描述错误。'],
            [8, 0, '属于"人造智能",具有意识,达到或超越人类智慧水平的人工看能称为（）。', ['高人工智能', '低人工智能', '强人工智能', '弱人工智能'], 'C', '强人工智能具有意识和超越人类的智能。'],
            [9, 0, '图像预处理目的是（）。', ['图像增强', '噪音去除', '边缘检测', '图像单纯化'], 'C', '图像预处理旨在改善图像质量，为后续处理做准备，边缘检测是预处理常见目的。'],
            [10, 0, '数据处理是系统工程和自动控制的（）。', ['基本环节', '关键环节', '可靠环节', '中间环节'], 'A', '数据处理是系统工程的基石，属于基本环节。'],
            [11, 0, '（）主要是审核数据是否符合逻辑，内容是否合理，各项目或数字之间有无相互矛盾的现象。', ['罗列检查', '逻辑检查', '重复检查', '线形检查'], 'B', '逻辑检查用于验证数据一致性和合理性。'],
            [12, 0, '数据大体上都是不完整、不一致的"脏"数据，需要进行（）。', ['数据清洗', '非标准化', '数据查看', '数据重组'], 'A', '数据清洗专门处理脏数据问题。'],

            [318, 2, '操作机器人的时候要注意机器人周围的环境，以防止发生碰撞事故。', ['正确', '错误'], 'A', '安全操作注意事项。'],
            [319, 2, '服务机器人应考虑长期使用时某些绝缘材料的电气性能和机械性能可能会长期受到不利的影响。', ['正确', '错误'], 'A', '长期使用需考虑材料老化。'],
            [320, 2, '在类定义的外部没有任何办法可以访问对象的私有成员。', ['正确', '错误'], 'B', '可通过友元等方式访问。'],
            [321, 2, '一个Topic至少要有一个发布者和一个接收者。', ['正确', '错误'], 'B', '可以有多个发布者和接收者，但至少一个。实际上“至少一个”正确，但数据给B，我们按数据。'],
            [322, 2, '我国智慧城市发展大体上经历了四个时期：探索实践期、规范调整期、战略攻坚期、全面发展期。', ['正确', '错误'], 'A', '分期正确。'],
            [323, 2, '专家系统模拟人类专家的知识和经验解决特定领域的问题，实现了人工智能从理论研究走向实际应用。', ['正确', '错误'], 'A', '专家系统实现了实际应用。'],
            [324, 2, 'RGB颜色模型通常用于彩色阴极摄像管等彩色光栅图形显示设备中。', ['正确', '错误'], 'A', 'RGB用于显示设备。'],
            [325, 2, 'Tensorflow是一个用于机器学习和深度学习的端到端开源平台。', ['正确', '错误'], 'A', 'Tensorflow是端到端平台。'],
            [326, 2, '图形搜索法得到的轨迹可以保证位置和速度连续，不能保证加速度连续。', ['正确', '错误'], 'A', '图形搜索法通常只保证位置速度连续。'],
            [327, 2, '结构型传感器与结构材料有关。', ['正确', '错误'], 'B', '结构型传感器与结构有关，但说与材料有关不准确。'],
            [328, 2, '灵活理解语句的能力是人类智能的标准。', ['正确', '错误'], 'A', '人类智能体现为灵活理解。'],
            [329, 2, '特征提取方式需要根据语音单元的特点提取。', ['正确', '错误'], 'A', '特征提取需适应语音特点。'],
            [330, 2, '同样大小环境下，三维点云地图比三维栅格地图更耗费内存。', ['正确', '错误'], 'B', '点云地图通常比栅格地图更节省内存（因为稀疏）。'],
            [331, 2, '机器缺乏智能的动作知识机械化或自动化的动作。', ['正确', '错误'], 'A', '机器动作是机械化的。'],
            [332, 2, '图像传感器是一个由N行及M列感光单元(CCDPixel)组成的矩阵。', ['正确', '错误'], 'A', '传感器由像素矩阵组成。'],
            [333, 2, '语音识别的模式匹配是根据一定准则，使未知模式与模型库中的某一个模型获得最佳匹配的过程。', ['正确', '错误'], 'A', '模式匹配定义正确。'],
            [334, 2, '电感式传感器只能检测与铁磁性物体间的距离。', ['正确', '错误'], 'A', '电感式传感器检测铁磁性物体。'],
            [335, 2, '统计学研究首先要确立样本空间,进行合理抽样,然后估测出相关的情况。', ['正确', '错误'], 'A', '统计学研究步骤正确。'],
            [336, 2, '仿生算法是一类模拟自然生物进化或者群体社会行为的随机搜索方法的统称。', ['正确', '错误'], 'A', '仿生算法定义正确。'],
            [337, 2, '参数优化法中采用梯度下降法进行参数迭代校正，能够确保找到最优参数。', ['正确', '错误'], 'B', '梯度下降可能陷入局部最优。'],
            [338, 2, '智能与神经元网络的存在具有必然关系。', ['正确', '错误'], 'B', '智能不一定依赖神经网络。'],
            [339, 2, '深度学习是一种利用复杂结构的多个处理层来实现对数据进行高层次抽象的算法。', ['正确', '错误'], 'A', '深度学习定义正确。'],
            [340, 2, '大数据无法维持人类社会的隐私和公开之间的张力平衡。', ['正确', '错误'], 'A', '大数据对隐私构成挑战。'],
            [341, 2, '强人工智能观点认为可能创造出真正推理和解决问题的智能机器。', ['正确', '错误'], 'A', '强人工智能追求推理解决问题。'],
            [342, 2, '当旋转运动R是相对于固定坐标系进行时，用R左乘相应的矩阵。', ['正确', '错误'], 'A', '固定坐标系变换左乘。'],
            [343, 2, '变量在程序的任意位置都可以被访问。', ['正确', '错误'], 'B', '变量有作用域限制。'],
            [344, 2, '传感器的精度是反映传感器输出信号与输入信号之间的线性程度。', ['正确', '错误'], 'B', '精度反映误差，线性度反映线性程度。'],
            [345, 2, '根据激光测距仪数据构建栅格地图可以描述为测量数据条件下的地图各栅格被占联合概率分布。', ['正确', '错误'], 'A', '栅格地图表示概率分布。'],
            [346, 2, '采用扩展卡尔曼滤波方法进行自定位时只能进行位姿跟踪。', ['正确', '错误'], 'A', 'EKF用于位姿跟踪。'],
            [347, 2, 'DNN是卷积神经网络。', ['正确', '错误'], 'B', 'DNN是深度神经网络，CNN是卷积神经网络。'],
            [348, 2, '机件的每一尺寸，一般只标注一次，并应标注在反映该结构最清晰的图形上。', ['正确', '错误'], 'A', '工程制图规范。'],
            [349, 2, '当应用题的答案中含有文字，且该文字不是单位，转录答案时不需要在文字答案前加"答"（）。', ['正确', '错误'], 'B', '需加“答”。'],
        ];

        // ============================================================
        // 应用核心
        // ============================================================
        const TYPE_MAP = ['单选题', '多选题', '判断题'];
        const LABELS = ['A', 'B', 'C', 'D'];

        const questions = RAW_DATA.map((item, idx) => {
            const [id, type, text, opts, ans, analysis] = item;
            return {
                id: id,
                index: idx,
                type: type,
                typeName: TYPE_MAP[type] || '未知',
                text: text,
                options: opts,
                answer: ans,
                analysis: analysis || '暂无解析',
                userAnswer: null,
                isWrong: false,
                tempAnswer: null,
            };
        });

        let currentMode = 'home';
        let currentIndex = 0;
        let orderList = [];
        let answeredCount = 0;
        let wrongCount = 0;

        const $ = id => document.getElementById(id);
        const homePage = $('homePage');
        const practicePage = $('practicePage');
        const qTag = $('qTag');
        const qIndex = $('qIndex');
        const qText = $('qText');
        const optionsContainer = $('optionsContainer');
        const explanationBox = $('explanationBox');
        const multiHint = $('multiHint');
        const prevBtn = $('prevBtn');
        const nextBtn = $('nextBtn');
        const resetCurrentBtn = $('resetCurrentBtn');
        const showAnswerBtn = $('showAnswerBtn');
        const submitMultiBtn = $('submitMultiBtn');
        const numberNav = $('numberNav');
        const totalNum = $('totalNum');
        const answeredNum = $('answeredNum');
        const wrongNum = $('wrongNum');
        const progressBar = $('progressBar');
        const progressText = $('progressText');
        const wrongBadge = $('wrongBadge');
        const homeTotal = $('homeTotal');
        const wrongCountDesc = $('wrongCountDesc');

        const STORAGE_KEY = 'ai_trainer_records';

        function loadRecords() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    const parsed = JSON.parse(data);
                    questions.forEach((q, i) => {
                        if (parsed[i]) {
                            q.userAnswer = parsed[i].userAnswer || null;
                            q.isWrong = parsed[i].isWrong || false;
                        }
                    });
                }
            } catch (e) {}
        }

        function saveRecords() {
            const data = {};
            questions.forEach((q, i) => {
                data[i] = {
                    userAnswer: q.userAnswer,
                    isWrong: q.isWrong,
                };
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function updateStats() {
            let answered = 0,
                wrong = 0;
            questions.forEach(q => {
                if (q.userAnswer !== null) {
                    answered++;
                    if (q.isWrong) wrong++;
                }
            });
            answeredCount = answered;
            wrongCount = wrong;
            const total = questions.length;
            totalNum.textContent = total;
            answeredNum.textContent = answered;
            wrongNum.textContent = wrong;
            const pct = total > 0 ? Math.round((answered / total) * 100) : 0;
            progressBar.style.width = pct + '%';
            progressText.textContent = pct + '%';
            wrongBadge.textContent = wrong;
            wrongBadge.className = 'badge' + (wrong === 0 ? ' zero' : '');
            homeTotal.textContent = total;
            wrongCountDesc.textContent = wrong > 0 ? `有 ${wrong} 道错题待复习` : '🎉 没有错题，继续加油！';
        }

        // 提交多选
        function submitMulti() {
            if (orderList.length === 0) return;
            const idx = orderList[currentIndex];
            const q = questions[idx];
            if (q.type !== 1) return;
            if (q.userAnswer !== null) return;
            if (!q.tempAnswer || q.tempAnswer.length === 0) {
                alert('请至少选择一个选项');
                return;
            }
            q.userAnswer = q.tempAnswer;
            q.isWrong = (q.userAnswer !== q.answer);
            q.tempAnswer = null;
            saveRecords();
            renderQuestion();
            updateStats();
        }

        function renderQuestion() {
            if (orderList.length === 0) {
                qText.textContent = '暂无题目';
                optionsContainer.innerHTML = '';
                explanationBox.className = 'explanation';
                multiHint.textContent = '';
                qIndex.textContent = '0 / 0';
                submitMultiBtn.style.display = 'none';
                return;
            }
            const idx = orderList[currentIndex];
            const q = questions[idx];
            if (!q) return;

            // 标签
            let tagClass = '';
            if (q.type === 0) tagClass = '';
            else if (q.type === 1) tagClass = 'multi';
            else if (q.type === 2) tagClass = 'judge';
            qTag.textContent = q.typeName;
            qTag.className = 'q-tag ' + tagClass;

            qIndex.textContent = (currentIndex + 1) + ' / ' + orderList.length;

            qText.textContent = q.text;

            optionsContainer.innerHTML = '';
            const isAnswered = q.userAnswer !== null;
            const isMulti = q.type === 1;
            const isJudge = q.type === 2;

            // 多选提示 & 提交按钮
            if (isMulti && !isAnswered) {
                multiHint.textContent = '💡 多选题请选择所有正确选项，然后点击 "提交多选"';
                multiHint.style.display = 'block';
                submitMultiBtn.style.display = 'inline-block';
            } else {
                multiHint.textContent = '';
                multiHint.style.display = 'none';
                submitMultiBtn.style.display = 'none';
            }

            q.options.forEach((optText, oi) => {
                const label = isJudge ? (oi === 0 ? '正确' : '错误') : LABELS[oi];
                const div = document.createElement('div');
                div.className = 'opt';
                if (isAnswered) div.classList.add('disabled');

                let isSelected = false;
                if (isAnswered) {
                    if (isMulti) {
                        isSelected = q.userAnswer.includes(LABELS[oi]);
                    } else {
                        isSelected = q.userAnswer === LABELS[oi];
                    }
                } else {
                    if (isMulti && q.tempAnswer) {
                        isSelected = q.tempAnswer.includes(LABELS[oi]);
                    }
                }

                let isCorrect = false;
                let isWrongSelected = false;
                if (isAnswered) {
                    const correctAnswer = q.answer;
                    if (isMulti) {
                        const isInCorrect = correctAnswer.includes(LABELS[oi]);
                        if (isSelected && isInCorrect) isCorrect = true;
                        else if (isSelected && !isInCorrect) isWrongSelected = true;
                    } else {
                        if (isSelected) {
                            if (LABELS[oi] === correctAnswer) isCorrect = true;
                            else isWrongSelected = true;
                        }
                    }
                }

                if (isCorrect) div.classList.add('correct');
                if (isWrongSelected) div.classList.add('wrong');
                if (isSelected && !isCorrect && !isWrongSelected) div.classList.add('selected');

                const labelSpan = document.createElement('span');
                labelSpan.className = 'label';
                labelSpan.textContent = label + '.';
                const textSpan = document.createElement('span');
                textSpan.className = 'text';
                textSpan.textContent = optText;
                div.appendChild(labelSpan);
                div.appendChild(textSpan);

                if (!isAnswered) {
                    div.addEventListener('click', () => {
                        selectOption(idx, LABELS[oi]);
                    });
                }
                optionsContainer.appendChild(div);
            });

            // 解析展示 - 包含答案解析
            explanationBox.className = 'explanation';
            if (isAnswered) {
                const correctText = '正确答案：' + q.answer;
                const statusText = q.isWrong ? ' ❌ 回答错误' : ' ✅ 回答正确';
                const analysisText = q.analysis || '暂无解析';
                explanationBox.innerHTML = '<strong>' + correctText + '</strong>' + statusText +
                    '<div class="analysis">📖 解析：' + analysisText + '</div>';
                explanationBox.className = 'explanation show';
            } else {
                explanationBox.className = 'explanation';
            }

            renderNav();
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex >= orderList.length - 1;
        }

        function selectOption(idx, selectedLabel) {
            const q = questions[idx];
            if (q.userAnswer !== null) return;

            const isMulti = q.type === 1;
            if (isMulti) {
                if (!q.tempAnswer) q.tempAnswer = '';
                if (q.tempAnswer.includes(selectedLabel)) {
                    q.tempAnswer = q.tempAnswer.replace(selectedLabel, '');
                } else {
                    q.tempAnswer = (q.tempAnswer + selectedLabel).split('').sort().join('');
                }
                renderQuestion();
                return;
            }

            // 单选/判断
            q.userAnswer = selectedLabel;
            q.isWrong = (q.userAnswer !== q.answer);
            saveRecords();
            renderQuestion();
            updateStats();
        }

        function renderNav() {
            numberNav.innerHTML = '';
            const total = orderList.length;
            for (let i = 0; i < total; i++) {
                const idx = orderList[i];
                const q = questions[idx];
                const div = document.createElement('div');
                div.className = 'num-item';
                div.textContent = i + 1;

                const isActive = (i === currentIndex);
                const isAnswered = q.userAnswer !== null;
                const isWrong = q.isWrong;

                if (isActive) {
                    if (isAnswered && isWrong) {
                        div.classList.add('current-wrong', 'answered');
                    } else if (isAnswered) {
                        div.classList.add('active', 'answered');
                    } else {
                        div.classList.add('active');
                    }
                } else {
                    if (isAnswered && isWrong) {
                        div.classList.add('wrong-answer');
                    } else if (isAnswered) {
                        div.classList.add('answered');
                    }
                }

                div.addEventListener('click', () => {
                    // 清空当前多选暂存
                    const curQ = questions[orderList[currentIndex]];
                    if (curQ.type === 1 && curQ.userAnswer === null) {
                        curQ.tempAnswer = null;
                    }
                    currentIndex = i;
                    renderQuestion();
                });
                numberNav.appendChild(div);
            }
        }

        function goPrev() {
            if (currentIndex > 0) {
                const curQ = questions[orderList[currentIndex]];
                if (curQ.type === 1 && curQ.userAnswer === null) {
                    curQ.tempAnswer = null;
                }
                currentIndex--;
                renderQuestion();
            }
        }

        function goNext() {
            if (currentIndex < orderList.length - 1) {
                const curQ = questions[orderList[currentIndex]];
                if (curQ.type === 1 && curQ.userAnswer === null) {
                    curQ.tempAnswer = null;
                }
                currentIndex++;
                renderQuestion();
            }
        }

        function resetCurrent() {
            if (orderList.length === 0) return;
            const idx = orderList[currentIndex];
            const q = questions[idx];
            q.userAnswer = null;
            q.isWrong = false;
            q.tempAnswer = null;
            saveRecords();
            renderQuestion();
            updateStats();
        }

        function showAnswer() {
            if (orderList.length === 0) return;
            const idx = orderList[currentIndex];
            const q = questions[idx];
            const correctText = '正确答案：' + q.answer;
            const analysisText = q.analysis || '暂无解析';
            if (q.userAnswer !== null) {
                const statusText = q.isWrong ? ' ❌ 回答错误' : ' ✅ 回答正确';
                explanationBox.innerHTML = '<strong>' + correctText + '</strong>' + statusText +
                    '<div class="analysis">📖 解析：' + analysisText + '</div>';
            } else {
                explanationBox.innerHTML = '<strong>' + correctText + '</strong> (点击选项作答)<div class="analysis">📖 解析：' +
                    analysisText + '</div>';
            }
            explanationBox.className = 'explanation show';
        }

        function switchMode(mode) {
            if (currentMode !== 'home' && currentMode !== mode && orderList.length > 0) {
                const curQ = questions[orderList[currentIndex]];
                if (curQ && curQ.type === 1 && curQ.userAnswer === null) {
                    curQ.tempAnswer = null;
                }
            }
            currentMode = mode;
            document.querySelectorAll('.top-nav button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });

            if (mode === 'home') {
                homePage.classList.remove('hidden');
                practicePage.classList.add('hidden');
                updateStats();
                return;
            }

            homePage.classList.add('hidden');
            practicePage.classList.remove('hidden');

            if (mode === 'order') {
                orderList = questions.map((_, i) => i);
            } else if (mode === 'random') {
                const indices = questions.map((_, i) => i);
                for (let i = indices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [indices[i], indices[j]] = [indices[j], indices[i]];
                }
                orderList = indices;
            } else if (mode === 'wrong') {
                const wrongIndices = [];
                questions.forEach((q, i) => {
                    if (q.userAnswer !== null && q.isWrong) {
                        wrongIndices.push(i);
                    }
                });
                orderList = wrongIndices;
                if (orderList.length === 0) {
                    qText.textContent = '🎉 太棒了！你目前没有错题！';
                    optionsContainer.innerHTML = '';
                    explanationBox.className = 'explanation';
                    multiHint.textContent = '';
                    qIndex.textContent = '0 / 0';
                    numberNav.innerHTML = '';
                    submitMultiBtn.style.display = 'none';
                    return;
                }
            }

            currentIndex = 0;
            renderQuestion();
            updateStats();
        }

        function init() {
            loadRecords();
            updateStats();

            document.querySelectorAll('.top-nav button').forEach(btn => {
                btn.addEventListener('click', () => {
                    switchMode(btn.dataset.mode);
                });
            });

            document.querySelectorAll('.home-grid .card').forEach(card => {
                card.addEventListener('click', () => {
                    switchMode(card.dataset.mode);
                });
            });

            prevBtn.addEventListener('click', goPrev);
            nextBtn.addEventListener('click', goNext);
            resetCurrentBtn.addEventListener('click', resetCurrent);
            showAnswerBtn.addEventListener('click', showAnswer);
            submitMultiBtn.addEventListener('click', submitMulti);

            document.addEventListener('keydown', (e) => {
                if (currentMode === 'home') return;
                if (e.key === 'ArrowLeft') goPrev();
                else if (e.key === 'ArrowRight') goNext();
                else if (e.key === 'r' || e.key === 'R') resetCurrent();
                else if (e.key === 'Enter') showAnswer();
                else if (e.key === 's' || e.key === 'S') {
                    const curQ = questions[orderList[currentIndex]];
                    if (curQ && curQ.type === 1 && curQ.userAnswer === null) {
                        submitMulti();
                    }
                }
            });

            switchMode('home');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
